<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Agent Clearing Desk architecture</title>
  <desc id="d">Agents call the desk over REST or MCP. One clearing path checks the tool, arguments, allowlist and budget, calls the upstream, and writes a signed receipt to D1.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa39e"/></marker>
    <style>
      .box{fill:#141716;stroke:#2c322f;stroke-width:1.5}
      .hi{fill:#10241b;stroke:#3ddc97;stroke-width:1.5}
      .h{fill:#f2f4f3;font-size:17px;font-weight:650}
      .s{fill:#a8b0ac;font-size:13px}
      .m{fill:#d8dedb;font-size:13px;font-family:ui-monospace, Menlo, monospace}
      .ok{fill:#3ddc97;font-size:13px;font-family:ui-monospace, Menlo, monospace}
      .no{fill:#ff7a66;font-size:13px;font-family:ui-monospace, Menlo, monospace}
      .l{stroke:#9aa39e;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .lab{fill:#7d8681;font-size:11px;letter-spacing:1.2px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#0a0c0b"/>

  <text x="40" y="44" class="h" font-size="22">Agent Clearing Desk</text>
  <text x="40" y="68" class="s">One Cloudflare Worker and one D1 database. Every governed call takes the same path.</text>

  <text x="40" y="112" class="lab">AGENTS</text>
  <rect x="40" y="124" width="220" height="92" rx="8" class="box"/>
  <text x="58" y="152" class="h">MCP clients</text>
  <text x="58" y="176" class="m">POST /mcp</text>
  <text x="58" y="198" class="s">x-api-key: cd_live_...</text>
  <rect x="40" y="232" width="220" height="92" rx="8" class="box"/>
  <text x="58" y="260" class="h">REST agents</text>
  <text x="58" y="284" class="m">POST /v1/tools/:name/run</text>
  <text x="58" y="306" class="s">same key, same rules</text>
  <rect x="40" y="340" width="220" height="92" rx="8" class="box"/>
  <text x="58" y="368" class="h">Operator</text>
  <text x="58" y="392" class="m">/api/admin/*</text>
  <text x="58" y="414" class="s">bearer token: keys, budgets</text>

  <text x="320" y="112" class="lab">CLEARING PATH (src/clearing.ts)</text>
  <rect x="320" y="124" width="420" height="380" rx="8" class="hi"/>
  <text x="344" y="158" class="m">1 known tool?<tspan x="590" class="no">404</tspan></text>
  <text x="344" y="190" class="m">2 required arguments?<tspan x="590" class="no">400</tspan></text>
  <text x="344" y="222" class="m">3 on the allowlist?<tspan x="590" class="no">403 + receipt</tspan></text>
  <text x="344" y="254" class="m">4 reserve price, atomic:</text>
  <text x="364" y="276" class="s">UPDATE ... WHERE spent_mc + price &lt;= budget_mc</text>
  <text x="364" y="298" class="m">no row changed<tspan x="590" class="no">402 + receipt</tspan></text>
  <text x="344" y="330" class="m">5 call the upstream</text>
  <text x="364" y="352" class="m">fail / timeout: refund<tspan x="590" class="no">502/504 + receipt</tspan></text>
  <text x="344" y="384" class="m">6 charge and sign<tspan x="590" class="ok">200 + receipt</tspan></text>
  <line x1="344" y1="406" x2="716" y2="406" stroke="#2c322f"/>
  <text x="344" y="432" class="s">Receipt: Ed25519 over canonical JSON with key, tool,</text>
  <text x="344" y="452" class="s">outcome, amount, upstream cost, input hash, result hash.</text>
  <text x="344" y="480" class="m">x-clearing-* headers on success and on refusals</text>

  <path d="M260 170 H312" class="l"/>
  <path d="M260 278 H312" class="l"/>
  <path d="M260 386 H312" class="l"/>

  <text x="800" y="112" class="lab">UPSTREAMS</text>
  <rect x="800" y="124" width="360" height="132" rx="8" class="box"/>
  <text x="818" y="152" class="h">OpenKrill</text>
  <text x="818" y="176" class="s">MCP: eu_duty_estimate, find_tariff_codes,</text>
  <text x="818" y="196" class="s">check_vat_number</text>
  <text x="818" y="220" class="s">REST: list_jobs, get_app_reviews, get_transcript</text>
  <text x="818" y="242" class="s">Connect OAuth token, refreshed in the Worker</text>
  <rect x="800" y="272" width="360" height="86" rx="8" class="box"/>
  <text x="818" y="300" class="h">DeepWiki (public MCP)</text>
  <text x="818" y="324" class="s">ask_repo_question, SSE answers</text>
  <text x="818" y="344" class="s">no fallback data on any upstream</text>
  <path d="M740 320 H760 V190 H792" class="l"/>
  <path d="M760 315 H792" class="l"/>

  <text x="800" y="400" class="lab">D1 LEDGER</text>
  <rect x="800" y="412" width="360" height="148" rx="8" class="box"/>
  <text x="818" y="440" class="m">organizations  agent_keys</text>
  <text x="818" y="462" class="m">audit_logs  receipts  usage_events</text>
  <text x="818" y="490" class="s">integer millicents; CHECK spent &lt;= budget</text>
  <text x="818" y="512" class="s">audit_logs and receipts are append-only</text>
  <text x="818" y="534" class="s">receipts visible only within their org</text>
  <path d="M740 450 H792" class="l"/>

  <rect x="320" y="528" width="420" height="72" rx="8" class="box"/>
  <text x="344" y="556" class="h">Anyone can verify, offline</text>
  <text x="344" y="580" class="m">/.well-known/receipt-signing-key.json</text>
  <path d="M530 504 V520" class="l"/>
</svg>
